# Deploys the public download site (site/) to Cloudflare Pages.
#
# The job skips itself until you add the two secrets, so it never fails a
# push while unconfigured. To switch it on:
#
#   1. Create a Pages project once:
#        npx wrangler pages project create hephaestus-downloads
#      (or just run this workflow — the first deploy creates the project)
#
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New secrets:
#        CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#        CLOUDFLARE_ACCOUNT_ID  (your Cloudflare account id)
#
#   3. Run this workflow manually ("Run workflow") or push a change under site/.

name: site

on:
  push:
    branches: [main, master]
    paths: ['site/**']
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deploy to cloudflare pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy site \
            --project-name hephaestus-downloads \
            --branch main
