# Deploys the landing page (site/) to Cloudflare Pages.
#
# A docs or design push to site/** is the whole trigger. There is no build step to run and no
# config file to edit: the folder is the site. What this job adds is one safety rule — a deploy
# must never delete a published release. site/ in the repo carries a `preparing` release.json and
# no /downloads/, because installers are not kept in git, so uploading the folder as-is over a live
# release would break every download link on the site. So the deployable bundle is assembled by
# tools/prepare-site.mjs, which copies the live release metadata and its files in first.
#
# Two secrets, and the job skips itself until they exist, so it can't fail an unrelated push:
#
#   1. Nothing to pre-create. The job asks the Pages API whether this account owns the project name
#      and creates it with `main` as the production branch if it is free. (Doing it explicitly is
#      required: `pages deploy` would otherwise *prompt* to create the missing project, and CI has
#      no keyboard — and without the production branch set you'd get main.hephaestus-app.pages.dev.)
#
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New secrets:
#        CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#        CLOUDFLARE_ACCOUNT_ID  (your Cloudflare account id)
#
#   3. Re-run this workflow manually, or push a change under site/.
#
# NOTE: GitHub refuses `secrets` inside `if:` conditions at both job and step level ("Unrecognized
# named-value: 'secrets'"). So there is no `if:` here — the secrets are copied into plain env vars
# (which IS allowed) and a shell check decides whether to deploy or to warn and skip.
#
# Release deploys go through release.yml, which takes the same concurrency lock: a docs push can
# never interleave with a release publish.

name: site

on:
  push:
    branches: [main, master]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hephaestus-release      # shared with release.yml: one deploy at a time, queue instead of race
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do not remove: current wrangler hard-fails under Node 22 ("Wrangler requires at least
      # Node.js v22.0.0"), and ubuntu-latest's built-in Node is 20.x. Without this pin the deploy
      # step dies before it ever reaches Cloudflare.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: deploy to cloudflare pages (or warn and skip)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'hephaestus-app' }}
        run: |
          set -euo pipefail
          # The :- defaults are load-bearing: this step runs under `set -u`, so a variable that is
          # merely absent (a human running it by hand, or a renamed secret) must skip cleanly
          # instead of aborting the shell before the check.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::site deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under repo Settings > Secrets and variables > Actions, then re-run this workflow"
            echo "The live site, if any, is untouched by this run."
            exit 0
          fi

          # The Pages project name IS the subdomain, and it cannot be renamed later — Cloudflare
          # only lets you delete the project and make a new one. Override without editing this file
          # by setting a repo variable PAGES_PROJECT.
          PROJECT="${PAGES_PROJECT:-hephaestus-app}"
          API="${CF_PAGES_API:-https://api.cloudflare.com/client/v4}"

          # Ask the API whether THIS ACCOUNT owns the name. `pages deploy` cannot be trusted here:
          # when the name belongs to somebody else it silently creates a suffixed clone
          # (hephaestus -> hephaestus-b4x), reports "Deployment complete", and the URL you wanted
          # 404s. Pages names are unique across all accounts.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")

          case "$status" in
            200)
              echo "Pages project '$PROJECT' already belongs to this account - deploying to it"
              ;;
            404)
              echo "no project named '$PROJECT' in this account - creating it (production branch: main)"
              resp=$(curl -s \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
                "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
              if [ "$(printf '%s' "$resp" | jq -r '.success')" != "true" ]; then
                echo "::error::Cloudflare refused to create the Pages project '$PROJECT'. Names are unique across every Cloudflare account, so the most likely reason is that someone else already owns it."
                printf '%s' "$resp" | jq -r '.errors[]? | "  Cloudflare said: \(.code): \(.message)"' >&2 || true
                echo ""
                echo "Pick a name that is yours. Two ways, then push:"
                echo "  1. repo variable  Settings > Secrets and variables > Actions > Variables > PAGES_PROJECT = <any free name>"
                echo "  2. edit this file  PROJECT=\"hephaestus-app\" (line above)"
                echo "A clean https://hephaestus.* URL only comes from a custom domain; pages.dev gives you the project name."
                exit 1
              fi
              echo "created '$PROJECT' with production branch 'main'"
              ;;
            *)
              echo "::error::Cloudflare answered HTTP $status while checking the project name - not deploying"
              exit 1
              ;;
          esac

          # ── assemble the bundle: the repo's site, plus whatever release is live ─────────────
          node tools/prepare-site.mjs --into site-built --carry-from "https://$PROJECT.pages.dev"

          npx --yes wrangler@latest pages deploy site-built \
            --project-name "$PROJECT" \
            --branch main

          # A green deploy step is not proof the site is reachable, and reachability of the page is
          # not proof the downloads resolve. Both are checked: this is the step that would have
          # caught the hephaestus-b4x mix-up on the first run instead of printing a false "live at".
          # A docs-only deploy is allowed to find "preparing" metadata (no release published yet),
          # which is why --allow-preparing is on here and off in release.yml.
          for _ in 1 2 3 4 5; do
            rm -f /tmp/live.html
            # `|| true`, not `|| echo 000`: curl already reports 000 for a failed connection, and
            # appending another zero-string made the check below read 000000.
            code=$(curl -s -o /tmp/live.html -w "%{http_code}" -L --max-time 20 \
              "https://$PROJECT.pages.dev" || true)
            code=${code:-000}
            if grep -qi "Hephaestus" /tmp/live.html 2>/dev/null; then
              echo "verified: https://$PROJECT.pages.dev is serving the site"
              node tools/verify-release.mjs --base "https://$PROJECT.pages.dev" --allow-preparing \
                || { echo "::error::the page deployed, but its release metadata or downloads do not check out"; exit 1; }
              exit 0
            fi
            echo "not up yet (HTTP $code); retrying in 6s"
            sleep 6
          done

          echo "::error::deployed, but https://$PROJECT.pages.dev is not serving the site (last check: HTTP $code)."
          echo "  If the deploy went to a different project name, that name is what is live - check Cloudflare > Workers & Pages."
          echo "  Otherwise set the production branch: Pages > $PROJECT > Settings > Production branch = main, then re-run."
          exit 1
