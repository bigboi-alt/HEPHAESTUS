# Deploys the public download site (site/) to Cloudflare Pages.
#
# The deploy step skips itself until you add the two secrets, so it never
# fails a push while unconfigured. To switch it on:
#
#   1. Nothing to pre-create. The job runs `pages project create hephaestus-app
#      --production-branch main` itself, tolerating "already exists" on every
#      later run, then deploys. Site lands on https://hephaestus-app.pages.dev.
#      (Doing it explicitly is required: `pages deploy` would otherwise *prompt*
#      to create the missing project, and CI has no keyboard — and without the
#      production branch set you'd get main.hephaestus-app.pages.dev instead.)
#
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New secrets:
#        CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#        CLOUDFLARE_ACCOUNT_ID  (your Cloudflare account id)
#
#   3. Re-run this workflow manually ("Run workflow") or push a change
#      under site/.
#
# NOTE: GitHub refuses `secrets` inside `if:` conditions at BOTH job and
# step level ("Unrecognized named-value: 'secrets'"). So there is no `if:`
# here — the secrets are copied into plain env vars (which IS allowed) and
# a shell check decides whether to deploy or to warn + skip.

name: site

on:
  push:
    branches: [main, master]
    paths: ['site/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do not remove: current wrangler hard-fails under Node 22 ("Wrangler requires
      # at least Node.js v22.0.0"), and ubuntu-latest's built-in Node is 20.x. Without
      # this pin the deploy step dies before it ever reaches Cloudflare.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: deploy to cloudflare pages (or warn and skip)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The :- defaults are load-bearing: this step runs under `set -u`, so a
          # variable that is merely absent (a human running it by hand, or a secret
          # renamed) must skip cleanly instead of aborting the shell before the check.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::site deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under repo Settings > Secrets and variables > Actions, then re-run this workflow"
            exit 0
          fi

          # The Pages project name IS the subdomain, and it cannot be renamed later -
          # Cloudflare only lets you delete the project and make a new one. Override
          # without editing this file by setting a repo variable PAGES_PROJECT.
          PROJECT="${PAGES_PROJECT:-hephaestus-app}"
          API="${CF_PAGES_API:-https://api.cloudflare.com/client/v4}"

          # Ask the API whether THIS ACCOUNT owns the name. `pages deploy` cannot be
          # trusted here: when the name belongs to somebody else it silently creates a
          # suffixed clone (hephaestus -> hephaestus-b4x), reports "Deployment complete",
          # and the URL you wanted 404s. Pages names are unique across all accounts.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")

          case "$status" in
            200)
              echo "Pages project '$PROJECT' already belongs to this account - deploying to it"
              ;;
            404)
              echo "no project named '$PROJECT' in this account - creating it (production branch: main)"
              resp=$(curl -s \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
                "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
              if [ "$(printf '%s' "$resp" | jq -r '.success')" != "true" ]; then
                echo "::error::Cloudflare refused to create the Pages project '$PROJECT'. Names are unique across every Cloudflare account, so the most likely reason is that someone else already owns it."
                printf '%s' "$resp" | jq -r '.errors[]? | "  Cloudflare said: \(.code): \(.message)"' >&2 || true
                echo ""
                echo "Pick a name that is yours. Two ways, then push:"
                echo "  1. repo variable  Settings > Secrets and variables > Actions > Variables > PAGES_PROJECT = <any free name>"
                echo "  2. edit this file  PROJECT=\"hephaestus-app\" (line above)"
                echo "A clean https://hephaestus.* URL only comes from a custom domain; pages.dev gives you the project name."
                exit 1
              fi
              echo "created '$PROJECT' with production branch 'main'"
              ;;
            *)
              echo "::error::Cloudflare answered HTTP $status while checking the project name - not deploying"
              exit 1
              ;;
          esac

          npx --yes wrangler@latest pages deploy site \
            --project-name "$PROJECT" \
            --branch main

          # A green deploy step is not proof the site is reachable. Poll the real URL
          # and check it is OUR page; this is the step that would have caught the
          # hephaestus-b4x mix-up on the first run instead of printing a false "live at".
          for _ in 1 2 3 4 5; do
            rm -f /tmp/live.html
            # `|| true`, not `|| echo 000`: curl already reports 000 for a failed
            # connection, and appending another zero-string made the error read 000000.
            code=$(curl -s -o /tmp/live.html -w "%{http_code}" -L --max-time 20 \
              "https://$PROJECT.pages.dev" || true)
            code=${code:-000}
            if grep -qi "Hephaestus" /tmp/live.html 2>/dev/null; then
              echo "verified: https://$PROJECT.pages.dev is serving the site"
              exit 0
            fi
            sleep 6
          done

          echo "::error::deployed, but https://$PROJECT.pages.dev is not serving the site (last check: HTTP $code)."
          echo "  If the deploy went to a different project name, that name is what is live - check Cloudflare > Workers & Pages."
          echo "  Otherwise set the production branch: Pages > $PROJECT > Settings > Production branch = main, then re-run."
          exit 1

