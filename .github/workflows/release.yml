# Hephaestus desktop release — GitHub Actions builds, Cloudflare Pages delivers.
#
# There is no GitHub Release in this pipeline, on purpose. GitHub is a private build factory: four
# native runners produce installers, hand them to temporary workflow artifacts, and a single final
# job validates them, places them into the deployable site as /downloads/*, writes release.json,
# and only then touches Cloudflare. A visitor downloads from your own hostname and never learns or
# cares that GitHub exists — which is also why this works identically whether the repository is
# public or private.
#
#   git tag v0.4.0 && git push --tags        → build, validate, deploy. The only automatic publisher.
#   Actions → Release → Run workflow         → build + validate ONLY. Nothing is deployed.
#   Actions → Release → Run, tick "publish" → the full deploy, same checks as a tag.
#
# Every rule that protects the live site:
#   · publish needs all four platform jobs to have succeeded — a cancelled or failed build deploys
#     nothing, so the last verified release stays exactly as it was
#   · the assembled bundle is deployed to a throwaway preview branch and verified (every file
#     fetched, byte length compared) BEFORE the same bundle is promoted to production
#   · nothing is ever deleted: whatever the live site already serves under /downloads/ is carried
#     into the new bundle first, so old links keep resolving
#   · missing Cloudflare secrets stop the deploy after the build, with an explanatory error, and a
#     preflight run needs no secrets at all
#
# Secrets required (repository → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare Pages: Edit            — only for the deploy steps
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard, right column — only for the deploy steps
# Optional, not required by anything here:
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD   in-app updater only; no updater is configured, and this
#                                           workflow will not invent keys. Apple Developer ID +
#                                           notarization credentials only if you ever sign macOS
#                                           builds; until then the site says "unsigned" truthfully.
# Nothing in this file needs GITHUB_TOKEN: no release object is created, so no write permission.
#
# Runner minutes: a public repo has unlimited Actions minutes; a private one on the Free plan has
# 2,000/month with macOS counted 10x and Windows 2x. Running out delays or blocks *new builds* — it
# cannot break a live site, because the site and its downloads no longer depend on GitHub.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: "Deploy to Cloudflare Pages if every check passes (leave off for a build-only preflight)"
      republish:
        type: boolean
        default: false
        description: "Allow re-deploying a version that is already live (bumping is normally the better answer)"

permissions:
  contents: write

# the same lock site.yml takes, so a docs deploy and a release deploy can never interleave
concurrency:
  group: hephaestus-release
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'hephaestus-app' }}
  LIVE_URL: https://${{ vars.PAGES_PROJECT || 'hephaestus-app' }}.pages.dev
  # installers are build output, not a deliverable to keep in GitHub for a month
  RETENTION_DAYS: '7'

jobs:
  # ── the cheap gate first: five minutes of macOS is expensive, a mislabelled version is worse ──
  gate:
    name: agree on a version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: package.json, Cargo.toml and tauri.conf.json must agree
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            node tools/release-manifest.mjs --check-config --expect-tag "${GITHUB_REF_NAME}"
          else
            node tools/release-manifest.mjs --check-config
          fi

      - name: decide whether this run may deploy
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          WANT_PUBLISH: ${{ inputs.publish }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          [ "$EVENT" = "push" ] && PUBLISH=true
          [ "$WANT_PUBLISH" = "true" ] && PUBLISH=true
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          {
            echo "### This run"
            echo "- version \`v$VER\`"
            echo "- mode **$([ "$PUBLISH" = true ] && echo 'publish (will deploy after every check)' || echo 'preflight (build + validate, no deploy)')**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: is this version already published?
        env:
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          live=$(curl -s --max-time 20 -o /tmp/live.json -w '%{http_code}' "$LIVE_URL/release.json" || echo 000)
          if [ "$live" != "200" ]; then echo "nothing readable at $LIVE_URL/release.json (HTTP $live) — first deploy, or the site is served from another project"; exit 0; fi
          NOW=$(node -p "try{JSON.parse(require('fs').readFileSync('/tmp/live.json','utf8')).version}catch(e){null}" || echo null)
          echo "live release.json: version $NOW, this run is v$VER"
          if [ "$NOW" = "$VER" ]; then
            if [ "${{ github.event_name }}" = "push" ] || [ "$REPUBLISH" != "true" ]; then
              echo "::error::v$VER is already the live release. Bump the version (node tools/bump.mjs <next>), or re-run this workflow with 'republish' ticked if you only need to rebuild the same files."
              exit 1
            fi
            echo "::warning::re-publishing v$VER over the live one, because 'republish' was ticked"
          fi

  # ── four native builds. Each one is allowed to fail the release, not just warn about it. ────────
  build-windows:
    name: windows x64
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      # no --bundles here on purpose: tauri.conf.json names the targets, and the release gate reads
      # the same list, so a target can't be built by one and expected by the other
      - name: build the installers
        run: npm run tauri build
      - name: upload the packages (temporary, not a deliverable)
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  build-linux:
    name: linux x64
    needs: gate
    # Pinned to 22.04 rather than -latest: the .deb is built against this distro's glibc and
    # libwebkit2gtk-4.1, so the version inside the bundle is the floor for the machines that can run
    # it. Standard runner size, so it costs nothing on a public repo — which is the part worth
    # keeping in mind, since a "-large"/"-x64"/"-arm64" label here would be billed and blocked
    # outright on an account without a card. `manifest-qa` asserts every runner stays standard.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: webkit + bundler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: build the packages
        run: npm run tauri build
      - name: upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  build-macos-arm:
    name: macos apple silicon
    needs: gate
    runs-on: macos-latest          # standard ARM runner: free on a public repo, 10x minute cost on a
    steps:                         # private one — so this workflow deliberately never runs on a push
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      - name: build the disk image
        run: npm run tauri build -- --target aarch64-apple-darwin
      - name: upload the package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  build-macos-intel:
    name: macos intel
    needs: gate
    # Cross-compiled on the same free ARM runner, NOT on "macos-latest-large". That is a *larger*
    # runner, and larger runners are billed even on public repositories — and, worse, they are
    # refused outright until a payment method exists on the account, which is the whole text of the
    # error: "recent account payments have failed or your spending limit needs to be increased".
    # Nothing ran; the job never had a chance to fail for a code reason. Standard runners are the
    # free-for-public-repos ones, so both slices build there and cargo emits x86_64 machine code from
    # ARM hardware. This works because the bundle has no sidecar and no plugin needing target libs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      - name: build the disk image (for x86_64, from an arm64 runner)
        run: npm run tauri build -- --target x86_64-apple-darwin
      - name: upload the package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  # ── one final job does the publishing, and only after every build above succeeded ──────────────
  publish:
    name: validate, place, deploy
    needs: [gate, build-windows, build-linux, build-macos-arm, build-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: collect the packages from the four runners
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true

      - name: what arrived
        run: |
          find artifacts -type f -printf '%10s  %P\n' | sort -k2 || true
          echo "files: $(find artifacts -type f | wc -l)"

      - name: assemble the deployable site (live files first, so nothing is deleted)
        run: |
          set -euo pipefail
          node tools/prepare-site.mjs --into site-built --files-only --carry-from "$LIVE_URL"
          node tools/release-manifest.mjs --scan artifacts \
            --version "${{ needs.gate.outputs.version }}" \
            --github-release "${{ github.repository }}" \
            --out site-built/release.json \
            --no-copy \
            --carry-from "$LIVE_URL"
          echo "- \`site-built/release.json\`: $(node -p "const r=require('./site-built/release.json'); r.status+' '+r.version+' · '+r.files.length+' files · '+(r.previous||[]).length+' previous')" 2>/dev/null || echo '(unreadable)')" >> "$GITHUB_STEP_SUMMARY"

      - name: preflight ends here
        if: needs.gate.outputs.publish != 'true'
        run: |
          echo "PREFLIGHT: the batch validated and nothing was deployed."
          echo "Release notes for the operator:"
          echo "  · to publish, push a tag:  git tag v$(node -p "require('./package.json').version") && git push --tags"
          echo "  · or re-run this workflow with 'publish' ticked"
          echo "  · this job's site-built/ is discarded with the run; it is never uploaded anywhere"
          exit 0

      # Everything below runs only on a publish.
      - name: publish packages to GitHub release
        if: needs.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hephaestus v${{ needs.gate.outputs.version }}
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: cloudflare credentials present?
        if: needs.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::the installers are built and valid, but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing, so nothing was deployed. The live site still serves the previous release. Add the secrets under Settings → Secrets and variables → Actions, then re-run this workflow with 'publish' ticked — the artifacts stay available for ${{ env.RETENTION_DAYS }} days."
            exit 1
          fi

      - name: deploy to a preview branch and verify there before production
        if: needs.gate.outputs.publish == 'true'
        id: preview
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site-built \
            --project-name "$PAGES_PROJECT" --branch "verify-${GITHUB_RUN_ID}" > /tmp/wrangler-preview.log 2>&1 \
            || { cat /tmp/wrangler-preview.log; echo "::error::the preview deploy failed; production untouched"; exit 1; }
          cat /tmp/wrangler-preview.log
          URL=$(grep -Eo 'https://[a-z0-9]+\.[a-z0-9-]+\.pages\.dev' /tmp/wrangler-preview.log | head -1)
          if [ -z "$URL" ]; then echo "::error::could not read the preview URL out of wrangler's output"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "preview: $URL"

      - name: every file in release.json must actually download, on the preview
        if: needs.gate.outputs.publish == 'true'
        run: node tools/verify-release.mjs --base "${{ steps.preview.outputs.url }}"

      - name: promote the verified bundle to production
        if: needs.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy site-built \
            --project-name "$PAGES_PROJECT" --branch main > /tmp/wrangler-prod.log 2>&1 \
            || { cat /tmp/wrangler-prod.log; echo "::error::production deploy failed. The previous deployment is still live — nothing was half-published."; exit 1; }
          tail -3 /tmp/wrangler-prod.log

      - name: and again against production
        if: needs.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # --expect-version is the point of this step. The production alias can keep serving the
          # PREVIOUS release for a few seconds after a successful deploy, and that older bundle passes
          # every structural check on its own: it has a manifest, its own files, and a correct page.
          # Only the version number tells "production is verified" apart from "production is lagging" -
          # and lagging is worth waiting on (--retry-for, cache-busted on every attempt), while a real
          # defect looks the same at second 1 and second 180, and then the run fails for it.
          node tools/verify-release.mjs --base "$LIVE_URL" \
            --expect-version "${{ needs.gate.outputs.version }}" --retry-for 180 \
            || {
              echo "::error::production is not serving the release that was just verified on the preview."
              echo "  Cloudflare keeps every deployment: Pages → $PAGES_PROJECT → view deployments, and"
              echo "  'npx wrangler pages deployment list --project-name $PAGES_PROJECT' prints the ids."
              echo "  The installers are already sitting in the new bundle, so if this is only the alias"
              echo "  lagging, re-running this step in a minute goes green without touching anything."
              echo "  Roll back to the previous deployment in the dashboard if it is not: the live site keeps"
              echo "  serving the old release either way, because nothing here deletes files."
              exit 1
            }

      - name: summary
        if: needs.gate.outputs.publish == 'true'
        run: |
          {
            echo "### Released"
            echo "- version **${{ needs.gate.outputs.version }}**"
            echo "- downloads: $(node -p "JSON.parse(require('fs').readFileSync('site-built/release.json','utf8')).files.map(f=>'\`'+f.url+'\`').join(' ')" 2>/dev/null || echo '?')"
            echo "- live: $LIVE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
