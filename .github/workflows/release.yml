# Releases Hephaestus desktop builds for Windows, macOS (Intel + Apple
# Silicon) and Linux. Runs on a version tag, or when you press the button.
#
# How it works
#   1. Each runner builds the frontend + the Tauri binary for its OS.
#   2. tauri-action finds (or creates) a DRAFT GitHub release tagged
#      v<VERSION> and uploads every installer to it as an asset.
#      Drafts keep being updated on later pushes, so just keep pushing.
#   3. When you are happy: open the repo on github.com -> Releases ->
#      edit the draft -> "Publish release". Publishing one updates the release page
#      on GitHub and nothing on the landing site: site/ carries no download links and
#      reads no API while the repo is private. If a card should ever link a build, the
#      edit is documented in site/README.md - three divs in #get, and the gate re-run.
#
# Before a new release, bump the version everywhere:
#     node tools/bump.mjs 0.2.0

name: release

# Two ways to build installers, and nothing else triggers this — a private repo is metered
# on Actions minutes, and macOS runners count 10x, so building three OSes on every push
# would eat a free plan's month in about ten commits to buy files nobody can download.
#
#   git tag v0.3.1 && git push --tags      -> builds, and PUBLISHES release v0.3.1.
#                                           The landing page notices by itself: its cards
#                                           read the newest published release.
#   Actions -> Release -> Run workflow     -> builds into a DRAFT you can look at first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# two tags in quick succession used to race over one draft release; this makes them queue
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # only used on macOS runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm ci

      # Guard: a push must NEVER silently overwrite a PUBLISHED release.
      # Same version as a published release = you forgot to bump -> fail
      # loudly with the fix. Updating a still-open DRAFT is fine (that's
      # the iterate flow: keep pushing to vX.Y.Z until you publish it).
      - name: refuse to overwrite a published release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "release version: v$VER"
          CODE=$(curl -s -o /tmp/rel.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$VER")
          if [ "$CODE" = "200" ]; then
            DRAFT=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/rel.json','utf8')).draft")
            echo "release v$VER exists (draft=$DRAFT)"
            if [ "$DRAFT" = "false" ]; then
              echo "::error::v$VER is already published. Bump the version first: node tools/bump.mjs <next-version> — then commit and push."
              exit 1
            fi
            echo "draft v$VER exists — its assets will be refreshed in place. Publish it when you're happy with this build."
          else
            echo "no release v$VER yet — tauri-action will create a new draft."
          fi

      - name: build + upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Hephaestus v__VERSION__'
          releaseBody: |
            Desktop build of Hephaestus v__VERSION__.

            **Installers**
            - Windows — `*_x64-setup.exe` (recommended) or `*.msi`
            - macOS — `*_aarch64.dmg` (Apple Silicon) or `*_x64.dmg` (Intel). Unsigned for now: right-click the app -> Open the first time.
            - Linux — `*.deb` (Debian/Ubuntu) or `*.AppImage` (any distro: chmod +x and run)

            Runs 100% local. No account, no telemetry, no AI.
          releaseDraft: ${{ github.event_name != 'push' }}   # a tag publishes; a manual run leaves a draft
          prerelease: false
          args: ${{ matrix.args }}
